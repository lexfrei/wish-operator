name: PR Checks and Build

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The jobs that build and test run branch-controlled code, so the default grant
# is read-only and the two jobs that need to write ask for it themselves.
permissions:
  contents: read

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Trivy vulnerability scanner (filesystem)
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'

      # Code scanning uploads need a write token, which fork and Dependabot runs
      # never get. Skip the upload there rather than fail the scan on a 403.
      # The leading success() only restates the default: GitHub applies success()
      # to any if: without a status-check function, so this step and the two
      # below already run only when the scan succeeded.
      # continue-on-error keeps a failed upload from failing the job, so that
      # default success() on the two steps below stays true and the artifact
      # fallback still runs; outcome remains 'failure' for them to read.
      - name: Upload Trivy filesystem results to GitHub Security
        id: code_scanning
        continue-on-error: true
        if: >-
          success() &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-filesystem'

      # Whenever there is a report but code scanning did not take it, whether it
      # was skipped on a fork run or failed outright. Reading both outcomes
      # rather than restating the condition inverted keeps the two in step, and
      # gating on the scan means a failed scan produces one error, not three.
      - name: Upload Trivy results as an artifact
        id: trivy_artifact
        if: >-
          steps.trivy.outcome == 'success' &&
          steps.code_scanning.outcome != 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-fs-results
          path: trivy-fs-results.sarif
          if-no-files-found: error
          retention-days: 7

      # A retained artifact nobody knows about is still a lost report.
      - name: Say where the Trivy report went
        if: steps.trivy_artifact.outcome == 'success'
        run: |
          {
            echo "## Trivy"
            echo ""
            echo "Code scanning did not take this report, either because the run has no"
            echo "permission to upload or because the upload failed. It is attached as the"
            echo "\`trivy-fs-results\` artifact instead: ${{ steps.trivy_artifact.outputs.artifact-url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # Trivy above is report-only; this is the step that turns a reachable
      # vulnerability into a red required check. It runs on !cancelled() so a
      # Trivy failure cannot silently skip the gate, and last so it never
      # disturbs the SARIF upload and artifact fallback. No templ step needed:
      # the generated files are committed.
      - name: Run govulncheck
        if: ${{ !cancelled() }}
        # renovate: datasource=go depName=golang.org/x/vuln
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@"$(go list -m -f '{{.Version}}' github.com/a-h/templ)"

      - name: Generate templ files
        run: templ generate

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.12.2
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@"$(go list -m -f '{{.Version}}' github.com/a-h/templ)"

      - name: Generate templ files
        run: templ generate

      - name: Setup envtest
        run: |
          # renovate: datasource=go depName=sigs.k8s.io/controller-runtime/tools/setup-envtest
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.24.1
          setup-envtest use

      - name: Run tests
        run: |
          # Assign and export separately: export is a builtin whose own exit
          # status masks a failing command substitution, so a broken
          # setup-envtest would otherwise run the suite with no assets at all.
          KUBEBUILDER_ASSETS="$(setup-envtest use -p path)"
          export KUBEBUILDER_ASSETS
          go test -v -race -tags=envtest -coverprofile=coverage.out -covermode=atomic $(go list ./... | grep -v /test/e2e)

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella

  lint-chart:
    name: Lint Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: v4.2.4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Install tools
        run: |
          # renovate: datasource=github-releases depName=helm-unittest/helm-unittest
          helm plugin install https://github.com/helm-unittest/helm-unittest.git --version 1.1.2 --verify=false
          pip install check-jsonschema

      - name: Run Helm Lint
        run: helm lint charts/wish-operator

      - name: Run Helm Unittest
        run: |
          CHART_DIR="charts/wish-operator"
          if [ -d "$CHART_DIR/tests" ]; then
            helm unittest "$CHART_DIR" --with-subchart=false --color
          else
            echo "No tests directory found, skipping unit tests"
          fi

      - name: Run chart-testing (lint)
        run: ct lint --charts charts/wish-operator

      - name: Validate JSON Schema
        run: |
          CHART_DIR="charts/wish-operator"
          if [ -f "$CHART_DIR/values.schema.json" ]; then
            check-jsonschema --schemafile "$CHART_DIR/values.schema.json" "$CHART_DIR/values.yaml"
          else
            echo "No values.schema.json found, skipping schema validation"
          fi

      - name: Template Chart
        run: helm template test-release charts/wish-operator

  build-and-push:
    name: Build and Push (${{ matrix.arch }})
    needs: [security, lint, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and Push to ttl.sh by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Containerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ttl.sh/wish-operator,push-by-digest=true,name-canonical=true,push=true
          # No build cache. Per-PR scopes multiply the repository budget by the
          # number of open branches, and nothing writes a scope a PR can read.
          # The image is built from the merge commit, but REVISION names the
          # head commit: the merge SHA is ephemeral and unresolvable once the
          # PR moves on, and the delta between them is base-branch code the PR
          # already identifies. The mismatch is deliberate, not an oversight.
          build-args: |
            VERSION=pr-${{ github.event.pull_request.number }}
            REVISION=${{ github.event.pull_request.head.sha }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifests:
    name: Merge Manifests
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          set -euo pipefail

          PR_NUMBER="${{ github.event.pull_request.number }}"
          IMAGE_NAME="ttl.sh/wish-operator"
          TAG="pr-${PR_NUMBER}-1d"

          images=()
          for digest_file in *; do
            [[ -f "$digest_file" ]] || continue
            images+=("${IMAGE_NAME}@sha256:${digest_file}")
          done

          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${TAG}" \
            "${images[@]}"

      - name: Inspect image
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          docker buildx imagetools inspect "ttl.sh/wish-operator:pr-${PR_NUMBER}-1d"

      - name: Generate build summary
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          IMAGE_TAG="ttl.sh/wish-operator:pr-${PR_NUMBER}-1d"

          {
            echo "## Multi-arch Container Image"
            echo ""
            echo "### Image Tag"
            echo "- \`${IMAGE_TAG}\`"
            echo ""
            echo "### Platforms"
            echo "- linux/amd64"
            echo "- linux/arm64"
            echo ""
            echo "### Pull Command"
            echo '```bash'
            echo "podman pull ${IMAGE_TAG}"
            echo '```'
            echo ""
            echo "> **Note:** Image expires in 24 hours (ttl.sh)"
          } >> "$GITHUB_STEP_SUMMARY"

  build-chart:
    name: Build Chart
    runs-on: ubuntu-latest
    needs: [security, lint, test, lint-chart]
    steps:
      - name: Checkout PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: v4.2.4

      - name: Modify Chart.yaml and values.yaml
        run: |
          set -euo pipefail

          PR_NUMBER="${{ github.event.pull_request.number }}"
          CHART_DIR="charts/wish-operator"
          CHART_VERSION="0.0.0-pr.${PR_NUMBER}-1d"
          APP_VERSION="pr-${PR_NUMBER}-1d"
          IMAGE_REPO="ttl.sh/wish-operator"
          IMAGE_TAG="pr-${PR_NUMBER}-1d"

          sed -i "s/^version: .*/version: ${CHART_VERSION}/" "${CHART_DIR}/Chart.yaml"
          sed -i "s/^appVersion: .*/appVersion: \"${APP_VERSION}\"/" "${CHART_DIR}/Chart.yaml"
          sed -i "s|repository: .*|repository: ${IMAGE_REPO}|" "${CHART_DIR}/values.yaml"
          sed -i "s/tag: .*/tag: \"${IMAGE_TAG}\"/" "${CHART_DIR}/values.yaml"

          echo "Modified chart version: ${CHART_VERSION}"
          echo "Modified appVersion: ${APP_VERSION}"
          echo "Modified image: ${IMAGE_REPO}:${IMAGE_TAG}"

      - name: Package chart
        run: |
          set -euo pipefail
          helm package charts/wish-operator
          ls -lh *.tgz

      - name: Push chart to ttl.sh
        run: |
          set -euo pipefail

          PR_NUMBER="${{ github.event.pull_request.number }}"
          CHART_VERSION="0.0.0-pr.${PR_NUMBER}-1d"
          CHART_PKG="wish-operator-${CHART_VERSION}.tgz"

          helm push "${CHART_PKG}" oci://ttl.sh

          echo "Chart pushed to: oci://ttl.sh/wish-operator:${CHART_VERSION}"

      - name: Generate chart summary
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          CHART_VERSION="0.0.0-pr.${PR_NUMBER}-1d"

          {
            echo "## Helm Chart"
            echo ""
            echo "### Chart Version"
            echo "- \`${CHART_VERSION}\`"
            echo ""
            echo "### Install Command"
            echo '```bash'
            echo "helm install wish-operator oci://ttl.sh/wish-operator --version ${CHART_VERSION}"
            echo '```'
            echo ""
            echo "> **Note:** Chart expires in 24 hours (ttl.sh)"
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Notify PR
    needs: [merge-manifests, build-chart]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # Labelling and commenting need a write token, which fork and Dependabot
    # runs never get, so those PRs no longer get the image and chart comment.
    # The leading success() only restates the default GitHub applies to an if:
    # without a status-check function, so this runs only when the needed jobs
    # succeeded and never advertises an image the build did not push.
    if: >-
      success() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    steps:
      - name: Check if first build
        id: first_build
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          result-encoding: string
          script: |
            const labels = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });

            const hasLabel = labels.data.some(label => label.name === 'Container Available');
            return hasLabel ? 'false' : 'true';

      - name: Add Container Available label
        if: steps.first_build.outputs.result == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['Container Available']
            })

      - name: Comment on PR (first time only)
        if: steps.first_build.outputs.result == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const imageTag = `ttl.sh/wish-operator:pr-${prNumber}-1d`;
            const chartVersion = `0.0.0-pr.${prNumber}-1d`;

            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Container image available\n\n**Multi-arch image (amd64 + arm64):**\n\`\`\`bash\npodman pull ${imageTag}\n\`\`\`\n\n## Helm chart available\n\n**Install chart:**\n\`\`\`bash\nhelm install wish-operator oci://ttl.sh/wish-operator --version ${chartVersion}\n\`\`\`\n\n> **Note:** Image and chart are rebuilt on every commit and expire after 24 hours (hosted on ttl.sh).`
            })
