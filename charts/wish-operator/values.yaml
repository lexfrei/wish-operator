# Values above 1 require operator.leaderElection: true and the chart refuses to
# render without it, because otherwise every replica reconciles the same objects
# concurrently. The web UI is served from every replica either way, and each one
# rate-limits independently, so the effective per-IP budget is
# operator.rateLimit multiplied by replicaCount.
replicaCount: 1

image:
  repository: ghcr.io/lexfrei/wish-operator
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Operator settings
operator:
  # Scopes the web UI only. The ClusterRole is cluster-wide and the controller
  # reconciles Wishes in all namespaces regardless of this value.
  namespace: default
  # Requests per second per IP. Each replica keeps its own limiter, so the budget
  # a single client actually gets is this value multiplied by replicaCount.
  rateLimit: 30
  rateBurst: 10
  # Number of proxies in front of the web server that append to X-Forwarded-For.
  # Rate limiting reads the client address that many entries from the right of
  # the header. Keep at 0 unless such a proxy is in front: with 0 the header is
  # ignored and the connection address is used, because anything else is
  # supplied by the caller and lets it pick its own rate limit bucket.
  trustedProxyHops: 0
  # Required when replicaCount is above 1; the chart refuses to render otherwise.
  leaderElection: false

# Gateway API HTTPRoute
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  hostnames: []
